name: turist

services:
  db:
    build:
      context: ./deploy/postgres
    image: turist-postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${DB_USER:?Set DB_USER in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    volumes:
      - turist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 128mb
    mem_limit: 512m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  backend:
    build:
      context: ./backend
      target: runner
    image: turist-backend:local
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:?Set DB_NAME in .env}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-lax}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      ANTICHEAT_MAX_SPEED_KMH: ${ANTICHEAT_MAX_SPEED_KMH:-180}
      ANTICHEAT_SCORE_REVIEW_THRESHOLD: ${ANTICHEAT_SCORE_REVIEW_THRESHOLD:-61}
      ANTICHEAT_SCORE_REJECT_THRESHOLD: ${ANTICHEAT_SCORE_REJECT_THRESHOLD:-86}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    networks:
      - application
      - database

  backend-init:
    build:
      context: ./backend
      target: build
    image: turist-backend-init:local
    profiles:
      - setup
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:?Set DB_NAME in .env}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "./node_modules/.bin/prisma db push --skip-generate && ./node_modules/.bin/ts-node prisma/seed.ts"]
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    networks:
      - database

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: turist-frontend:local
    restart: unless-stopped
    init: true
    mem_limit: 640m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m,uid=1000,gid=1000,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - application

  staging-proxy:
    image: nginx:stable-alpine
    profiles:
      - staging
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - application

volumes:
  turist_postgres_data:
    name: turist_postgres_data

networks:
  application:
    name: turist_application
  database:
    name: turist_database
    internal: true
